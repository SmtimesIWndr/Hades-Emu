[package]
name = "hades-emu"
version = "0.1.0"
edition = "2024"

[dependencies]
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "instr_info", "code_asm"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_Memory", "Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_SystemInformation"] }

[dev-dependencies]
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "encoder", "block_encoder", "instr_info", "code_asm", "intel"] }

[profile.release]
debug = 1
